<!doctype html>
<html lang="sv">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Slutprojekt - Grupp 1</title>

		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
		/>
		<link rel="stylesheet" href="./src/style.css" />
	</head>

	<body data-page="index">
		<div
			id="notice"
			class="alert position-fixed bottom-0 start-50 translate-middle-x mb-3 d-none"
			role="status"
		></div>

		<header class="bg-white border-bottom py-3">
			<div class="container">
				<span class="fs-4">Scrum Board</span>
			</div>
		</header>

		<main class="container py-5">
			<div class="row g-4">
				<!-- Projekt -->
				<section class="col-lg-8">
					<div class="d-flex justify-content-between align-items-center mb-3">
						<h2 class="h4 mb-0">Projekt</h2>
						<button
							type="button"
							class="btn btn-primary"
							data-bs-toggle="modal"
							data-bs-target="#new-project-modal"
						>
							+ Nytt projekt
						</button>
					</div>

					<div id="project-list" class="row g-3"></div>
				</section>

				<!-- Medlemmar -->
				<section class="col-lg-4">
					<div class="card">
						<div class="card-body">
							<div class="d-flex justify-content-between align-items-center mb-2">
								<h2 class="h4 mb-0">Medlemmar</h2>
								<button
									type="button"
									class="btn btn-outline-dark"
									data-bs-toggle="modal"
									data-bs-target="#new-member-modal"
								>
									+ Ny medlem
								</button>
							</div>

							<ul id="member-list" class="list-group list-group-flush"></ul>
						</div>
					</div>
				</section>
			</div>
		</main>

		<div
			class="modal fade"
			id="new-project-modal"
			tabindex="-1"
			aria-labelledby="new-project-title"
			aria-hidden="true"
		>
			<div class="modal-dialog">
				<form class="modal-content" id="new-project-form">
					<div class="modal-header">
						<h2 class="modal-title fs-5" id="new-project-title">Skapa nytt projekt</h2>
						<button
							type="button"
							class="btn-close"
							data-bs-dismiss="modal"
							aria-label="Stäng"
						></button>
					</div>

					<div class="modal-body">
						<div class="mb-3">
							<label for="project-name" class="form-label small">Projektnamn *</label>
							<input
								type="text"
								class="form-control"
								id="project-name"
								name="name"
								required
							/>
						</div>

						<div class="mb-3">
							<label for="project-description" class="form-label small"
								>Beskrivning *</label
							>
							<textarea
								class="form-control"
								id="project-description"
								name="description"
								required
							></textarea>
						</div>

						<div class="mb-3">
							<label for="project-deadline" class="form-label small"
								>Deadline *</label
							>
							<input
								type="date"
								class="form-control"
								id="project-deadline"
								name="deadline"
								required
							/>
						</div>

						<div class="mb-3">
							<label for="project-members" class="form-label small"
								>Välj medlemmar</label
							>
							<select
								class="form-select"
								id="project-members"
								name="memberIds"
								multiple
							></select>
						</div>

						<p
							id="project-error"
							class="small text-danger mb-0 d-none"
							role="alert"
						></p>
					</div>

					<div class="modal-footer">
						<button type="button" class="btn btn-outline-dark" data-bs-dismiss="modal">
							Avbryt
						</button>
						<button type="submit" class="btn btn-primary">Skapa projekt</button>
					</div>
				</form>
			</div>
		</div>

		<div
			class="modal fade"
			id="new-member-modal"
			tabindex="-1"
			aria-labelledby="new-member-title"
			aria-hidden="true"
		>
			<div class="modal-dialog">
				<form class="modal-content" id="new-member-form">
					<div class="modal-header">
						<h2 class="modal-title fs-5" id="new-member-title">Lägg till medlem</h2>
						<button
							type="button"
							class="btn-close"
							data-bs-dismiss="modal"
							aria-label="Stäng"
						></button>
					</div>

					<div class="modal-body">
						<div class="mb-3">
							<label for="member-name" class="form-label small">Namn *</label>
							<input
								type="text"
								class="form-control"
								id="member-name"
								name="name"
								required
							/>
						</div>

						<div class="mb-3">
							<label for="member-category" class="form-label small">Kategori *</label>
							<select
								class="form-select"
								id="member-category"
								name="category"
								required
							></select>
						</div>

						<p id="member-error" class="small text-danger mb-0 d-none" role="alert"></p>
					</div>

					<div class="modal-footer">
						<button type="button" class="btn btn-outline-dark" data-bs-dismiss="modal">
							Avbryt
						</button>
						<button type="submit" class="btn btn-primary">Lägg till medlem</button>
					</div>
				</form>
			</div>
		</div>

		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
